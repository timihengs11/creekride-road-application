<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreekRide ULTIMATE - Works</title>
<style>body{font-family:Arial;margin:0;background:#f5f5f5}.h{background:#0f766e;color:#fff;padding:20px;text-align:center}.y{background:gold;color:#000;padding:12px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px;margin-top:10px}.b{margin:12px;background:#fff;padding:15px;border-radius:10px;border-left:4px solid #0f766e}input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}.btn{width:100%;padding:12px;background:#0f766e;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer}.r{margin-top:8px;padding:8px;border-radius:6px;display:none;font-size:13px;white-space:pre-wrap;word-break:break-all}.ok{background:#dcfce7;color:#166534;display:block}.er{background:#fee2e2;color:#991b1b;display:block}</style>
</head><body>
<div class="h"><h2>CreekRide Bayelsa - ULTIMATE FIX</h2><p id="st">Backend: Click Wake Button!</p><button class="y" id="wb" onclick="wake()">CLICK TO WAKE BACKEND - 40 SEC</button></div>

<div class="b"><h3>REGISTER</h3><input id="rn" placeholder="Full Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password">
<button class="btn" onclick="reg()">REGISTER</button><div id="rr" class="r"></div></div>

<div class="b"><h3>LOGIN</h3><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password">
<button class="btn" onclick="login()">LOGIN</button><div id="lr" class="r"></div></div>

<div class="b"><h3>RIDES</h3><button class="btn" onclick="getRides()" style="background:#f97316">LOAD RIDES</button><div id="ar"></div></div>

<script>
var API='https://creekride-road-application-2.onrender.com';var TOKEN='';var LIVE=false;
function msg(id,t,ok){var e=document.getElementById(id);e.style.display='block';e.textContent=t;e.className='r '+(ok?'ok':'er');}
function wake(){
 var s=document.getElementById('st');var b=document.getElementById('wb');
 s.textContent='Waking backend... wait 40 sec...';b.textContent='WAKING... WAIT...';
 var x=new XMLHttpRequest();x.open('GET',API+'/',true);x.onload=function(){
  if(x.status==200){LIVE=true;s.textContent='✅ LIVE! '+x.responseText.substring(0,100);b.textContent='✅ LIVE! READY!';b.style.background='#22c55e';b.style.color='#fff';}
  else{s.textContent='Status '+x.status+' - click Wake again';b.textContent='Click Wake Again';}
 };x.onerror=function(){s.textContent='Still sleeping - click Wake again in 20 sec';b.textContent='Click Wake Again';};x.send();
}
function reg(){
 if(!LIVE){msg('rr','Click WAKE button first! Wait green!',false);return;}
 var n=document.getElementById('rn').value,e=document.getElementById('re').value,p=document.getElementById('rp').value;
 if(!n||!e||!p){msg('rr','Fill all fields',false);return;}
 msg('rr','Registering...',true);
 var x=new XMLHttpRequest();x.open('POST',API+'/register',true);x.setRequestHeader('Content-Type','application/json');
 x.onload=function(){
  if(x.status==200||x.status==201){msg('rr','✅ SUCCESS! '+x.responseText,true);document.getElementById('le').value=e;document.getElementById('lp').value=p;}
  else{if(x.status==400)msg('rr','Already exists! Go LOGIN! '+x.responseText,true);else msg('rr','Error '+x.status+': '+x.responseText,false);}
 };x.send(JSON.stringify({full_name:n,email:e,password:p}));
}
function login(){
 if(!LIVE){msg('lr','Wake first!',false);return;}
 var e=document.getElementById('le').value,p=document.getElementById('lp').value;
 var x=new XMLHttpRequest();x.open('POST',API+'/login',true);x.setRequestHeader('Content-Type','application/json');
 x.onload=function(){
  if(x.status==200){var d=JSON.parse(x.responseText);TOKEN=d.access_token;msg('lr','✅ LOGIN SUCCESS! Token saved! '+x.responseText,true);}
  else msg('lr','Failed '+x.status+': '+x.responseText,false);
 };x.send(JSON.stringify({email:e,password:p}));
}
function getRides(){
 var ar=document.getElementById('ar');ar.innerHTML='Loading...';
 var x=new XMLHttpRequest();x.open('GET',API+'/rides',true);
 x.onload=function(){ar.innerHTML='<pre style="background:#eee;padding:8px;font-size:11px;white-space:pre-wrap">'+x.responseText+'</pre>';};
 x.send();
}
</script></body></html>
