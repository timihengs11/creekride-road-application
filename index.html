<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CreekRide</title><style>body{margin:0;font-family:Arial;background:#f0f9f8}.h{background:#1a8a7a;color:#fff;padding:20px}.c{background:#fff;margin:15px;padding:20px;border-radius:12px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.b{width:100%;padding:14px;background:#1a8a7a;color:#fff;border:none;border-radius:8px;font-weight:bold}#r{margin-top:10px;padding:10px;display:none;border-radius:8px}</style></head><body><div class="h"><h1>Move Through The Creeks</h1><p>Bayelsa to the World - Backend LIVE 200 OK for James!</p></div><div class="c"><h3>Create account</h3><input id="n" placeholder="Full name"><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password"><button class="b" onclick="reg()">Register - Live API</button><div id="r"></div></div><script>const API="https://creekride-road-application-2.onrender.com";async function reg(){const N=document.getElementById('n').value;const E=document.getElementById('e').value;const P=document.getElementById('p').value;const R=document.getElementById('r');R.style.display='block';try{const res=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:N,email:E,password:P})});const d=await res.json();R.style.background=res.ok?'#d4edda':'#f8d7da';R.textContent=res.ok?'200 OK LIVE - '+JSON.stringify(d):'Error: '+JSON.stringify(d);}catch(err){R.textContent='Retrying backend wake: '+err.message}}</script></body></html>
