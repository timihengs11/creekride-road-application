<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CreekRide</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f0f9f8}.header{background:#1a8a7a;color:white;padding:20px}.header h1{margin:0;font-size:28px}.live{background:gold;color:#000;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;display:inline-block;margin-top:8px}.tabs{display:flex;gap:10px;padding:15px;background:white;border-bottom:1px solid #ddd}.tabs button{padding:8px 16px;border:none;border-radius:20px;background:#eee;cursor:pointer;font-weight:bold}.tabs button.active{background:#1a8a7a;color:white}.card{background:white;margin:15px;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.card h3{margin-top:0;color:#1a8a7a}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.btn{width:100%;padding:14px;background:#1a8a7a;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}.result{margin-top:15px;padding:12px;border-radius:8px;display:none}.success{background:#d4edda;color:#155724}.error{background:#f8d7da;color:#721c24}</style></head><body><div class="header"><h1>Move Through<br>The Creeks</h1><p>Warri to the World - Backend LIVE 200 OK for James!</p><span class="live">LIVE API</span></div><div class="tabs"><button class="active">Register</button><button>Login</button><button>Create Ride</button></div><div class="card"><h3>Create account</h3><input id="reg_name" placeholder="Full name e.g. James"><input id="reg_email" placeholder="Email e.g. test@gmail.com"><input id="reg_pass" type="password" placeholder="Password"><button class="btn" onclick="doRegister()">Register - Live API</button><div id="reg_result" class="result"></div></div><script>const API="https://creekride-road-application-2.onrender.com";async function doRegister(){const n=document.getElementById('reg_name').value,e=document.getElementById('reg_email').value,p=document.getElementById('reg_pass').value;const r=document.getElementById('reg_result');r.style.display='block';try{const res=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:n,email:e,password:p})});const d=await res.json();r.className='result '+(res.ok?'success':'error');r.textContent=res.ok?'200 OK LIVE Rides - '+JSON.stringify(d):'Error: '+JSON.stringify(d)}catch(err){r.className='result error';r.textContent='Network - Backend waking, retry in 30s: '+err.message}}</script></body></html>
